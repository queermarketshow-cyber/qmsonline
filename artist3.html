<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutte le Artistə — Queer Market Show</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="artists-page">
  <div class="logo-background" aria-hidden="true"></div>

  <header class="navbar">
    <a href="index.html" class="logo">Queer Market Show</a>
    <nav class="menu-desktop" aria-label="Menu principale">
      <a href="index.html#manifesto">Manifesto</a>
      <a href="eventi.html">Eventi</a>
      <a href="index.html#artistə" class="active">Artistə</a>
      <a href="index.html#gallery">Galleria</a>
      <a href="index.html#contatti">Contatti</a>
    </nav>
    <button type="button" class="menu-toggle" aria-label="Apri menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <nav class="menu-mobile" aria-label="Menu mobile">
    <a href="index.html#manifesto">Manifesto</a>
    <a href="eventi.html">Eventi</a>
    <a href="index.html#artistə" class="active">Artistə</a>
    <a href="index.html#gallery">Galleria</a>
    <a href="index.html#contatti">Contatti</a>
  </nav>

  <main class="artists-page-main">
    <div class="section-tears" aria-hidden="true">
      <span class="tear tear-top tear-foto"></span>
      <span class="tear tear-bottom tear-nero"></span>
    </div>
    <header class="section-header">
      <h1>Tutte le Artistə</h1>
      <p>Residenti, ospiti e tutte le figure della comunità Queer Market Show.</p>
    </header>

    <div class="artist-controls" id="all-artists-filters">
      <button
        type="button"
        class="artist-filters-dropdown-toggle"
        data-action="toggle-filters-dropdown"
        aria-expanded="false"
        aria-controls="artist-filters-panel"
      >
        <span>Filtri: <strong data-filters-summary>Tutte · Tutti i tag</strong></span>
        <span class="artist-filters-caret" aria-hidden="true">▾</span>
      </button>

      <div class="artist-filters-panel" id="artist-filters-panel">
        <div class="artist-filter-group artist-filter-group--type" role="group" aria-label="Filtra per categoria">
          <button type="button" class="active" data-artist-filter="all">Tutte</button>
          <button type="button" data-artist-filter="resident">Residenti</button>
          <button type="button" data-artist-filter="guest">Ospiti</button>
        </div>

        <div class="artist-filter-divider" aria-hidden="true"></div>

        <div
          class="artist-filter-group artist-filter-group--tags"
          id="artists-tag-filters"
          role="group"
          aria-label="Filtra per tag"
        ></div>

        <button
          type="button"
          class="artist-filter-reset"
          data-action="reset-artist-filters"
          title="Reimposta filtri"
        >
          Reset
        </button>
      </div>
    </div>

    <div id="artists-all" class="artist-gallery"></div>
    <div class="artist-page-divider" aria-hidden="true">
      <span class="tear tear-bottom tear-nero"></span>
    </div>

<div class="artists-page-cta">

    <div class="artists-page-cta">
      <a href="index.html#artistə" class="sticker-button manifesto-button">
        ← Torna alla Home
      </a>
    </div>

    <div id="artist-modals"></div>
  </main>

  <script src="assets/js/base.js" defer></script>
  <script src="assets/js/artists.js" defer></script>
</body>
</html>
